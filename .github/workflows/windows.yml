# Windows build (Q-71): compiles and smoke-tests the PowerShell helper on a real Windows machine,
# then builds the installer (Tabhush-Setup-<version>.exe) and keeps it as a downloadable artifact.
name: windows
on:
  push:
    branches: [main]
    paths: ["apps/desktop/**", "packages/core/**", "scripts/**", ".github/workflows/windows.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Windows helper edge-case test (compiles the C#, real Notepad, relaunch guard)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File apps/desktop/native/helper-win.test.ps1
      - run: npx vitest run apps/desktop/test/engine.test.ts apps/desktop/test/system.test.ts apps/desktop/test/updates.test.ts
      - run: npm run fetch-model -w @tabhush/desktop
      - run: npm run build-categories -w @tabhush/desktop
      - run: npm run dist:win -w @tabhush/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: Tabhush-Windows
          # The installer plus the update feed (latest.yml) and the block map for small downloads (Q-75).
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.exe.blockmap
            apps/desktop/release/latest.yml
          retention-days: 30
